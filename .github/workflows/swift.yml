name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build
        run: swift build -c release

      - name: Archive App Bundle
        run: |
          make bundle
          mkdir -p .build/app
          cp -R RimeManager.app .build/app/
          cd .build/app && zip -r ../../RimeManager.zip RimeManager.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimeManager
          path: RimeManager.zip
